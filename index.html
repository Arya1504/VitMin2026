<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum V: Vitamin & Mineral — Simulasi Laboratorium</title>
    <!-- Google Fonts: Poppins untuk heading, Inter untuk teks body -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' },
                        accent: { 400: '#fbbf24', 500: '#f59e0b' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif']
                    },
                    boxShadow: {
                        '3d': '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)',
                        'inner-light': 'inset 0 2px 4px 0 rgba(255, 255, 255, 0.3)'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .font-heading { font-family: 'Poppins', sans-serif; }
        
        /* 3D Perspective Setup */
        .scene-3d {
            perspective: 1200px;
            transform-style: preserve-3d;
        }
        
        .table-3d {
            transform: rotateX(20deg) scale(0.95);
            transform-origin: bottom center;
            transition: transform 0.5s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .object-3d {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.15));
        }

        /* Animasi Gelembung & Endapan */
        @keyframes bubbleRise {
            0% { transform: translateY(10px) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
        }
        .bubble {
            animation: bubbleRise 1.5s infinite ease-in;
            transform-origin: center;
        }

        /* Scrollbar Halus */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Glassmorphism untuk elemen lab */
        .glass-tube {
            fill: rgba(255, 255, 255, 0.4);
            stroke: #cbd5e1;
            stroke-width: 3;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-brand-100 selection:text-brand-900">

    <div id="app" class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Render dinamis via JS -->
    </div>

    <script>
        /**
         * STATE GLOBAL APLIKASI (Semua tergabung dalam satu antarmuka)
         */
        const AppState = {
            screen: 'landing', // 'landing', 'lab'
            activeTab: 'vit_c', // 'vit_c', 'vit_b6', 'filtrat', 'kalsium', 'fosfat', 'klorida', 'buku'
            studentName: '',
            studentNIM: '',
            
            // Progress Uji Vitamin C
            vitCFruitIndex: 0,
            vitCDrops: [0, 0, 0, 0, 0],
            vitCFinished: [false, false, false, false, false],
            
            // Progress Uji Vitamin B6
            b6SampleIndex: 0,
            b6Step: 0, // 0: Siap, 1: +CuSO4, 2: +NaOH (Selesai)
            b6Finished: [false, false, false],

            // Progress Uji Mineral
            filtratStep: 0, // 0: Serbuk Kasar, 1: Ditumbuk, 2: Ditambah Air, 3: Disaring (Selesai)
            kalsiumStep: 0, // 0: Filtrat, 1: +HCl (Gelembung), 2: +Na2CO3 (Endapan Putih)
            fosfatStep: 0,  // 0: Filtrat, 1: +HNO3, 2: +Amonium Molibdat (Kuning)
            kloridaStep: 0, // 0: Filtrat, 1: +HNO3, 2: +AgNO3 (Endapan Putih)

            // Catatan Pengamatan
            notes: {
                vitC: [],
                vitB6: [],
                mineral: []
            }
        };

        // Data Konstanta
        const fruitData = [
            { name: "Ekstrak Jambu Biji", drops: 15, color: "#86efac" },
            { name: "Ekstrak Pepaya", drops: 12, color: "#fdba74" },
            { name: "Ekstrak Jeruk", drops: 9, color: "#fde047" },
            { name: "Ekstrak Mangga", drops: 6, color: "#fef08a" },
            { name: "Ekstrak Apel", drops: 3, color: "#ecfccb" }
        ];

        const b6SampleData = [
            { name: "Sampel A (Rendah)", category: "Kadar Rendah", color: "#bbf7d0" },
            { name: "Sampel B (Sedang)", category: "Kadar Sedang", color: "#93c5fd" },
            { name: "Sampel C (Tinggi)", category: "Kadar Tinggi", color: "#c084fc" }
        ];

        const tabs = [
            { id: 'vit_c', icon: '🍊', title: 'Uji Vitamin C' },
            { id: 'vit_b6', icon: '🧪', title: 'Uji Vitamin B6' },
            { id: 'filtrat', icon: '🥚', title: 'Pembuatan Filtrat' },
            { id: 'kalsium', icon: '🥛', title: 'Uji Kalsium' },
            { id: 'fosfat', icon: '✨', title: 'Uji Fosfat' },
            { id: 'klorida', icon: '🧂', title: 'Uji Klorida' },
            { id: 'buku', icon: '📖', title: 'Buku Laporan' }
        ];

        /**
         * RENDER UTAMA
         */
        function render() {
            const app = document.getElementById('app');
            if (AppState.screen === 'landing') {
                app.innerHTML = renderLanding();
            } else {
                app.innerHTML = renderLabDashboard();
            }
        }

        /**
         * 1. LAYAR AWAL (Terang, Bersih, Sederhana)
         */
        function renderLanding() {
            return `
            <div class="flex-1 flex flex-col justify-center items-center bg-white relative">
                <!-- Ornamen Latar Abstrak -->
                <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
                    <div class="absolute -top-24 -right-24 w-96 h-96 bg-brand-50 rounded-full blur-3xl opacity-60"></div>
                    <div class="absolute top-1/2 -left-24 w-72 h-72 bg-blue-50 rounded-full blur-3xl opacity-60"></div>
                </div>

                <div class="z-10 bg-white border border-slate-100 p-10 rounded-3xl shadow-2xl max-w-lg w-full text-center">
                    <div class="w-20 h-20 bg-brand-100 text-brand-600 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-sm">🔬</div>
                    
                    <h1 class="font-heading text-3xl text-slate-800 font-bold mb-2">Praktikum V</h1>
                    <h2 class="font-heading text-xl text-brand-600 font-semibold mb-8">Vitamin & Mineral</h2>
                    
                    <div class="space-y-5 text-left">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Nama Lengkap</label>
                            <input type="text" id="input-name" value="${AppState.studentName}" class="w-full border border-slate-300 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition shadow-sm bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">NIM</label>
                            <input type="text" id="input-nim" value="${AppState.studentNIM}" class="w-full border border-slate-300 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition shadow-sm bg-slate-50">
                        </div>
                    </div>

                    <button onclick="startLab()" class="mt-8 w-full bg-brand-600 hover:bg-brand-700 text-white font-heading font-bold text-lg px-6 py-4 rounded-xl transition shadow-lg shadow-brand-500/30 transform hover:-translate-y-1">
                        Mulai Praktikum
                    </button>
                </div>
            </div>
            `;
        }

        function startLab() {
            AppState.studentName = document.getElementById('input-name').value;
            AppState.studentNIM = document.getElementById('input-nim').value;
            AppState.screen = 'lab';
            render();
        }

        /**
         * 2. DASHBOARD LAB TERPADU
         */
        function renderLabDashboard() {
            let activeContent = '';
            switch(AppState.activeTab) {
                case 'vit_c': activeContent = renderVitC(); break;
                case 'vit_b6': activeContent = renderVitB6(); break;
                case 'filtrat': activeContent = renderFiltrat(); break;
                case 'kalsium': activeContent = renderKalsium(); break;
                case 'fosfat': activeContent = renderFosfat(); break;
                case 'klorida': activeContent = renderKlorida(); break;
                case 'buku': activeContent = renderBuku(); break;
            }

            let tabsHTML = tabs.map(t => `
                <button onclick="switchTab('${t.id}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all duration-200 ${AppState.activeTab === t.id ? 'bg-brand-50 text-brand-700 font-semibold shadow-sm border border-brand-100' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'}">
                    <span class="text-xl">${t.icon}</span>
                    <span class="text-sm">${t.title}</span>
                </button>
            `).join('');

            return `
            <!-- Top Navbar -->
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center z-20 shadow-sm shrink-0">
                <div class="flex items-center space-x-3">
                    <div class="bg-brand-100 p-2 rounded-lg text-brand-600">🧪</div>
                    <div>
                        <h1 class="font-heading font-bold text-slate-800 leading-tight">Laboratorium Biokimia Gizi</h1>
                        <p class="text-xs text-slate-500">${AppState.studentName || 'Praktikan'} - ${AppState.studentNIM || '-'}</p>
                    </div>
                </div>
                <button onclick="location.reload()" class="text-sm text-slate-500 hover:text-red-500 transition font-medium border border-slate-200 hover:border-red-200 px-4 py-2 rounded-lg bg-slate-50">
                    Keluar Praktikum
                </button>
            </header>

            <div class="flex flex-1 overflow-hidden bg-slate-50">
                <!-- Sidebar Navigasi -->
                <aside class="w-64 bg-white border-r border-slate-200 p-4 flex flex-col space-y-1 overflow-y-auto shrink-0 z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-4 mt-2">Modul Praktikum</div>
                    ${tabsHTML}
                </aside>

                <!-- Area Kerja Utama -->
                <main class="flex-1 relative overflow-y-auto p-6 md:p-10 scene-3d flex flex-col">
                    ${activeContent}
                </main>
            </div>
            `;
        }

        function switchTab(tabId) {
            AppState.activeTab = tabId;
            render();
        }

        function recordNote(type, data) {
            AppState.notes[type].push(data);
        }

        /**
         * ================= MODUL UJI =================
         */

        // HELPER: RENDER TABUNG SVG 3D-Look (Light Theme)
        function getSVGTube(color, heightPercent, showBubbles = false, showPrecipitate = false, precipitateColor = '#ffffff') {
            let liquidY = 160 - (100 * heightPercent);
            let liquidHeight = 100 * heightPercent;
            
            let bubbles = showBubbles ? `
                <circle cx="50" cy="140" r="2" fill="#fff" class="bubble" style="animation-delay: 0s" />
                <circle cx="45" cy="130" r="1.5" fill="#fff" class="bubble" style="animation-delay: 0.3s" />
                <circle cx="55" cy="150" r="2.5" fill="#fff" class="bubble" style="animation-delay: 0.6s" />
                <circle cx="48" cy="120" r="2" fill="#fff" class="bubble" style="animation-delay: 0.9s" />
            ` : '';

            let precipitate = showPrecipitate ? `
                <path d="M 37 150 Q 50 140 63 150 L 63 160 Q 50 170 37 160 Z" fill="${precipitateColor}" opacity="0.9" />
                <ellipse cx="50" cy="155" rx="13" ry="4" fill="#cbd5e1" opacity="0.5" />
            ` : '';

            return `
            <svg class="w-32 h-48 drop-shadow-xl object-3d" viewBox="0 0 100 200">
                <!-- Bayangan Tabung -->
                <ellipse cx="50" cy="165" rx="20" ry="6" fill="rgba(0,0,0,0.1)" filter="blur(4px)" />
                
                <!-- Cairan Background -->
                ${heightPercent > 0 ? `
                    <path d="M 37 ${liquidY} L 37 150 Q 37 170 50 170 Q 63 170 63 150 L 63 ${liquidY} Z" fill="${color}" opacity="0.8" />
                ` : ''}

                <!-- Efek Kaca Belakang -->
                <path d="M 35 20 L 35 150 Q 35 175 50 175 Q 65 175 65 150 L 65 20" fill="#f8fafc" opacity="0.4" />
                
                ${bubbles}
                ${precipitate}

                <!-- Permukaan Cairan (Meniskus) -->
                ${heightPercent > 0 ? `
                    <ellipse cx="50" cy="${liquidY}" rx="13" ry="4" fill="${color}" opacity="0.95" />
                ` : ''}

                <!-- Kaca Tabung Depan (Refleksi) -->
                <path d="M 35 20 L 35 150 Q 35 175 50 175 Q 65 175 65 150 L 65 20" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.5" />
                <path d="M 38 30 L 38 140" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7" /> <!-- Highlight -->
            </svg>
            `;
        }

        // --- 1. UJI VITAMIN C ---
        function renderVitC() {
            const fruit = fruitData[AppState.vitCFruitIndex];
            const drops = AppState.vitCDrops[AppState.vitCFruitIndex];
            const isDone = AppState.vitCFinished[AppState.vitCFruitIndex];
            
            let colorPercent = Math.min(1, drops / fruit.drops);
            let displayColor = colorPercent >= 1 ? '#b45309' : fruit.color; // Cokelat saat selesai

            let fruitBtns = fruitData.map((f, i) => `
                <button onclick="AppState.vitCFruitIndex=${i}; render()" class="px-4 py-2 rounded-xl text-sm font-semibold transition ${i === AppState.vitCFruitIndex ? 'bg-brand-600 text-white shadow-md' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">
                    ${f.name.split(' ')[1]} ${AppState.vitCFinished[i] ? '✓' : ''}
                </button>
            `).join('');

            return `
            <div class="max-w-4xl mx-auto w-full flex flex-col h-full">
                <div class="mb-6">
                    <h2 class="font-heading text-2xl text-slate-800 font-bold">Uji Vitamin C (Titrasi Redoks)</h2>
                    <p class="text-slate-500 text-sm">Teteskan Betadine (I2) hingga tercapai titik akhir (warna cokelat menetap).</p>
                </div>

                <div class="flex gap-2 mb-8 justify-center">${fruitBtns}</div>

                <div class="flex-1 bg-white border border-slate-200 rounded-3xl shadow-sm flex flex-col items-center justify-center p-10 relative">
                    <!-- Meja 3D -->
                    <div class="absolute bottom-0 w-full h-1/3 bg-slate-100 table-3d border-t border-slate-200 rounded-b-3xl"></div>
                    
                    <div class="z-10 flex flex-col items-center relative">
                        <!-- Pipet jatuh -->
                        ${drops > 0 && !isDone ? '<div class="absolute top-0 text-orange-700 animate-bounce text-2xl">💧</div>' : ''}
                        
                        ${getSVGTube(displayColor, 0.4 + (colorPercent * 0.1))}

                        <div class="mt-8 text-center bg-white/90 backdrop-blur px-6 py-3 rounded-2xl shadow-sm border border-slate-100">
                            <div class="text-slate-500 text-sm font-medium">${fruit.name}</div>
                            <div class="text-brand-600 font-heading font-bold text-xl">${drops} Tetes Betadine</div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-center gap-4">
                    <button onclick="actionVitCDrop()" ${isDone ? 'disabled' : ''} class="bg-brand-600 hover:bg-brand-700 text-white px-8 py-3 rounded-xl font-bold shadow-md transition disabled:opacity-50">
                        💧 Teteskan Betadine
                    </button>
                    <button onclick="actionVitCFinish()" ${isDone ? 'disabled' : ''} class="bg-accent-500 hover:bg-accent-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition disabled:opacity-50">
                        🚩 Simpan Hasil (Titik Akhir)
                    </button>
                </div>
            </div>
            `;
        }

        function actionVitCDrop() {
            let limit = fruitData[AppState.vitCFruitIndex].drops + 3;
            if (AppState.vitCDrops[AppState.vitCFruitIndex] < limit) {
                AppState.vitCDrops[AppState.vitCFruitIndex]++;
                render();
            }
        }

        function actionVitCFinish() {
            AppState.vitCFinished[AppState.vitCFruitIndex] = true;
            recordNote('vitC', {
                name: fruitData[AppState.vitCFruitIndex].name,
                drops: AppState.vitCDrops[AppState.vitCFruitIndex]
            });
            render();
        }

        // --- 2. UJI VITAMIN B6 ---
        function renderVitB6() {
            const sample = b6SampleData[AppState.b6SampleIndex];
            const isDone = AppState.b6Finished[AppState.b6SampleIndex];
            const step = AppState.b6Step;

            let color = '#e2e8f0'; // Bening awal
            if (step === 1) color = '#93c5fd'; // Biru muda (CuSO4)
            if (step === 2) color = sample.color; // Warna kompleks akhir

            let sampleBtns = b6SampleData.map((s, i) => `
                <button onclick="AppState.b6SampleIndex=${i}; AppState.b6Step=0; render()" class="px-4 py-2 rounded-xl text-sm font-semibold transition ${i === AppState.b6SampleIndex ? 'bg-brand-600 text-white shadow-md' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">
                    ${s.name} ${AppState.b6Finished[i] ? '✓' : ''}
                </button>
            `).join('');

            return `
            <div class="max-w-4xl mx-auto w-full flex flex-col h-full">
                <div class="mb-6">
                    <h2 class="font-heading text-2xl text-slate-800 font-bold">Uji Vitamin B6 (Kompleks Cu)</h2>
                    <p class="text-slate-500 text-sm">Tambahkan CuSO4 dan NaOH untuk melihat intensitas warna ungu kompleks.</p>
                </div>

                <div class="flex gap-2 mb-8 justify-center">${sampleBtns}</div>

                <div class="flex-1 bg-white border border-slate-200 rounded-3xl shadow-sm flex flex-col items-center justify-center p-10 relative">
                    <div class="absolute bottom-0 w-full h-1/3 bg-slate-100 table-3d border-t border-slate-200 rounded-b-3xl"></div>
                    
                    <div class="z-10 flex flex-col items-center">
                        ${getSVGTube(color, 0.3 + (step * 0.1))}
                        <div class="mt-8 text-center bg-white/90 backdrop-blur px-6 py-3 rounded-2xl shadow-sm border border-slate-100">
                            <div class="text-slate-500 text-sm font-medium">Status:</div>
                            <div class="text-brand-600 font-heading font-bold text-lg">${step === 0 ? 'Siap' : step === 1 ? 'Ditambah CuSO4' : 'Reaksi Selesai: ' + sample.category}</div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-center gap-4">
                    ${step === 0 ? `<button onclick="AppState.b6Step=1; render()" class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">1. Tambah CuSO4 5%</button>` : ''}
                    ${step === 1 ? `<button onclick="AppState.b6Step=2; render()" class="bg-purple-500 hover:bg-purple-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">2. Tambah NaOH 10% (Basa)</button>` : ''}
                    ${step === 2 && !isDone ? `<button onclick="actionB6Finish()" class="bg-accent-500 hover:bg-accent-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">🚩 Simpan Hasil</button>` : ''}
                    ${isDone ? `<div class="px-8 py-3 font-bold text-brand-600">✓ Hasil Disimpan</div>` : ''}
                </div>
            </div>
            `;
        }

        function actionB6Finish() {
            AppState.b6Finished[AppState.b6SampleIndex] = true;
            recordNote('vitB6', {
                name: b6SampleData[AppState.b6SampleIndex].name,
                result: b6SampleData[AppState.b6SampleIndex].category
            });
            render();
        }

        // --- 3. PEMBUATAN FILTRAT ---
        function renderFiltrat() {
            const step = AppState.filtratStep;
            
            // Visual Mortar Sederhana
            let mortarVisual = `
                <svg class="w-48 h-48 drop-shadow-xl object-3d" viewBox="0 0 100 100">
                    <path d="M 20 50 Q 50 90 80 50 L 75 40 Q 50 70 25 40 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
                    ${step === 0 ? `<circle cx="45" cy="55" r="5" fill="#fef3c7"/><circle cx="55" cy="58" r="4" fill="#fef3c7"/>` : ''}
                    ${step >= 1 ? `<path d="M 35 60 Q 50 65 65 60 L 60 55 Q 50 60 40 55 Z" fill="#fef3c7"/>` : ''}
                    ${step >= 2 ? `<path d="M 30 55 Q 50 75 70 55 Z" fill="#bae6fd" opacity="0.6"/>` : ''}
                    <!-- Alu -->
                    <path d="M 70 10 L 55 45 L 45 40 L 60 5 Z" fill="#94a3b8" />
                </svg>
            `;

            return `
            <div class="max-w-4xl mx-auto w-full flex flex-col h-full">
                <div class="mb-6">
                    <h2 class="font-heading text-2xl text-slate-800 font-bold">Preparasi: Filtrat Cangkang Telur</h2>
                    <p class="text-slate-500 text-sm">Persiapan larutan stok mineral dari serbuk cangkang telur.</p>
                </div>

                <div class="flex-1 bg-white border border-slate-200 rounded-3xl shadow-sm flex flex-col items-center justify-center p-10 relative">
                    <div class="absolute bottom-0 w-full h-1/3 bg-slate-100 table-3d border-t border-slate-200 rounded-b-3xl"></div>
                    
                    <div class="z-10 flex flex-col items-center">
                        ${step < 3 ? mortarVisual : getSVGTube('#fef3c7', 0.5)}
                        <div class="mt-8 text-center bg-white/90 backdrop-blur px-6 py-3 rounded-2xl shadow-sm border border-slate-100">
                            <div class="text-brand-600 font-heading font-bold text-lg">
                                ${step === 0 ? 'Cangkang Telur Utuh' : step === 1 ? 'Serbuk Halus' : step === 2 ? 'Serbuk + Aquades' : 'Filtrat Siap Pakai'}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-center gap-4">
                    ${step === 0 ? `<button onclick="AppState.filtratStep=1; render()" class="bg-brand-600 hover:bg-brand-700 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">🔨 Tumbuk Cangkang</button>` : ''}
                    ${step === 1 ? `<button onclick="AppState.filtratStep=2; render()" class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">💧 Tambah Aquades & Aduk</button>` : ''}
                    ${step === 2 ? `<button onclick="AppState.filtratStep=3; render()" class="bg-accent-500 hover:bg-accent-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">⚗️ Saring menjadi Filtrat</button>` : ''}
                    ${step === 3 ? `<div class="px-8 py-3 font-bold text-brand-600">✓ Filtrat siap untuk Uji Mineral</div>` : ''}
                </div>
            </div>
            `;
        }

        // --- 4. UJI KALSIUM ---
        function renderKalsium() {
            const step = AppState.kalsiumStep;
            if (AppState.filtratStep < 3) return renderNotReady();

            let color = '#fef3c7'; // Filtrat
            if (step === 2) color = '#f8fafc'; // Putih keruh endapan

            return `
            <div class="max-w-4xl mx-auto w-full flex flex-col h-full">
                <div class="mb-6">
                    <h2 class="font-heading text-2xl text-slate-800 font-bold">Uji Kalsium (Ca²⁺)</h2>
                    <p class="text-slate-500 text-sm">Tambahkan HCl lalu Na2CO3 untuk mengendapkan kalsium karbonat (putih).</p>
                </div>

                <div class="flex-1 bg-white border border-slate-200 rounded-3xl shadow-sm flex flex-col items-center justify-center p-10 relative">
                    <div class="absolute bottom-0 w-full h-1/3 bg-slate-100 table-3d border-t border-slate-200 rounded-b-3xl"></div>
                    <div class="z-10 flex flex-col items-center">
                        ${getSVGTube(color, 0.3 + (step * 0.1), step === 1, step === 2, '#e2e8f0')}
                        <div class="mt-8 text-center bg-white/90 backdrop-blur px-6 py-3 rounded-2xl shadow-sm border border-slate-100">
                            <div class="text-brand-600 font-heading font-bold text-lg">
                                ${step === 0 ? 'Filtrat Awal' : step === 1 ? 'Gelembung Gas CO2 terbentuk' : 'Endapan Putih CaCO3 terbentuk'}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-center gap-4">
                    ${step === 0 ? `<button onclick="AppState.kalsiumStep=1; render()" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">1. Tambah HCl 3mL</button>` : ''}
                    ${step === 1 ? `<button onclick="AppState.kalsiumStep=2; render()" class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">2. Saring & Tambah Na2CO3 5%</button>` : ''}
                    ${step === 2 ? `<button onclick="recordNote('mineral', {name: 'Kalsium', result: 'Positif (Endapan Putih)'}); AppState.kalsiumStep=3; render()" class="bg-accent-500 text-white px-8 py-3 rounded-xl font-bold shadow-md">🚩 Catat Hasil</button>` : ''}
                    ${step === 3 ? `<div class="px-8 py-3 font-bold text-brand-600">✓ Tercatat di Buku Laporan</div>` : ''}
                </div>
            </div>
            `;
        }

        // --- 5. UJI FOSFAT ---
        function renderFosfat() {
            const step = AppState.fosfatStep;
            if (AppState.filtratStep < 3) return renderNotReady();

            let color = '#fef3c7'; // Filtrat
            if (step === 2) color = '#fde047'; // Kuning

            return `
            <div class="max-w-4xl mx-auto w-full flex flex-col h-full">
                <div class="mb-6">
                    <h2 class="font-heading text-2xl text-slate-800 font-bold">Uji Fosfat (PO4³⁻)</h2>
                    <p class="text-slate-500 text-sm">Reaksikan dengan HNO3 dan Amonium Molibdat (terbentuk warna/endapan kuning).</p>
                </div>

                <div class="flex-1 bg-white border border-slate-200 rounded-3xl shadow-sm flex flex-col items-center justify-center p-10 relative">
                    <div class="absolute bottom-0 w-full h-1/3 bg-slate-100 table-3d border-t border-slate-200 rounded-b-3xl"></div>
                    <div class="z-10 flex flex-col items-center">
                        ${getSVGTube(color, 0.3 + (step * 0.1), false, step === 2, '#facc15')}
                        <div class="mt-8 text-center bg-white/90 backdrop-blur px-6 py-3 rounded-2xl shadow-sm border border-slate-100">
                            <div class="text-brand-600 font-heading font-bold text-lg">
                                ${step === 0 ? 'Filtrat Awal' : step === 1 ? 'Kondisi Asam (Bening)' : 'Kompleks Kuning terbentuk'}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-center gap-4">
                    ${step === 0 ? `<button onclick="AppState.fosfatStep=1; render()" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">1. Tambah HNO3 2mL</button>` : ''}
                    ${step === 1 ? `<button onclick="AppState.fosfatStep=2; render()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">2. Tambah Amonium Molibdat</button>` : ''}
                    ${step === 2 ? `<button onclick="recordNote('mineral', {name: 'Fosfat', result: 'Positif (Kuning)'}); AppState.fosfatStep=3; render()" class="bg-accent-500 text-white px-8 py-3 rounded-xl font-bold shadow-md">🚩 Catat Hasil</button>` : ''}
                    ${step === 3 ? `<div class="px-8 py-3 font-bold text-brand-600">✓ Tercatat di Buku Laporan</div>` : ''}
                </div>
            </div>
            `;
        }

        // --- 6. UJI KLORIDA ---
        function renderKlorida() {
            const step = AppState.kloridaStep;
            if (AppState.filtratStep < 3) return renderNotReady();

            let color = '#fef3c7'; // Filtrat
            if (step === 2) color = '#f8fafc'; // Putih keruh AgCl

            return `
            <div class="max-w-4xl mx-auto w-full flex flex-col h-full">
                <div class="mb-6">
                    <h2 class="font-heading text-2xl text-slate-800 font-bold">Uji Klorida (Cl⁻)</h2>
                    <p class="text-slate-500 text-sm">Tambahkan HNO3 lalu perak nitrat (AgNO3) untuk endapan perak klorida (AgCl).</p>
                </div>

                <div class="flex-1 bg-white border border-slate-200 rounded-3xl shadow-sm flex flex-col items-center justify-center p-10 relative">
                    <div class="absolute bottom-0 w-full h-1/3 bg-slate-100 table-3d border-t border-slate-200 rounded-b-3xl"></div>
                    <div class="z-10 flex flex-col items-center">
                        ${getSVGTube(color, 0.3 + (step * 0.1), false, step === 2, '#e2e8f0')}
                        <div class="mt-8 text-center bg-white/90 backdrop-blur px-6 py-3 rounded-2xl shadow-sm border border-slate-100">
                            <div class="text-brand-600 font-heading font-bold text-lg">
                                ${step === 0 ? 'Filtrat Awal' : step === 1 ? 'Kondisi Asam (Bening)' : 'Endapan Putih AgCl terbentuk'}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6 flex justify-center gap-4">
                    ${step === 0 ? `<button onclick="AppState.kloridaStep=1; render()" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">1. Tambah HNO3 2mL</button>` : ''}
                    ${step === 1 ? `<button onclick="AppState.kloridaStep=2; render()" class="bg-slate-700 hover:bg-slate-800 text-white px-8 py-3 rounded-xl font-bold shadow-md transition">2. Tambah AgNO3 2%</button>` : ''}
                    ${step === 2 ? `<button onclick="recordNote('mineral', {name: 'Klorida', result: 'Positif (Endapan Putih)'}); AppState.kloridaStep=3; render()" class="bg-accent-500 text-white px-8 py-3 rounded-xl font-bold shadow-md">🚩 Catat Hasil</button>` : ''}
                    ${step === 3 ? `<div class="px-8 py-3 font-bold text-brand-600">✓ Tercatat di Buku Laporan</div>` : ''}
                </div>
            </div>
            `;
        }

        function renderNotReady() {
            return `
            <div class="flex flex-col items-center justify-center h-full space-y-4">
                <div class="text-6xl">🥚</div>
                <h3 class="text-xl font-bold text-slate-800">Filtrat Belum Tersedia</h3>
                <p class="text-slate-500 text-center max-w-md">Anda harus menyelesaikan "Pembuatan Filtrat" terlebih dahulu sebelum melakukan uji mineral.</p>
                <button onclick="switchTab('filtrat')" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2 rounded-lg font-bold shadow-md">Buat Filtrat Sekarang</button>
            </div>
            `;
        }

        // --- 7. BUKU LAPORAN ---
        function renderBuku() {
            let vitCHtml = AppState.notes.vitC.map(n => `
                <tr class="border-b border-slate-100">
                    <td class="p-3 text-slate-700 font-medium">${n.name}</td>
                    <td class="p-3 text-brand-600 font-bold text-center">${n.drops}</td>
                </tr>
            `).join('') || `<tr><td colspan="2" class="p-4 text-center text-slate-400 italic">Belum ada data uji Vitamin C</td></tr>`;

            let b6Html = AppState.notes.vitB6.map(n => `
                <tr class="border-b border-slate-100">
                    <td class="p-3 text-slate-700 font-medium">${n.name}</td>
                    <td class="p-3 text-brand-600 font-bold">${n.result}</td>
                </tr>
            `).join('') || `<tr><td colspan="2" class="p-4 text-center text-slate-400 italic">Belum ada data uji Vitamin B6</td></tr>`;

            let mineralHtml = AppState.notes.mineral.map(n => `
                <tr class="border-b border-slate-100">
                    <td class="p-3 text-slate-700 font-medium">Uji ${n.name}</td>
                    <td class="p-3 text-brand-600 font-bold">${n.result}</td>
                </tr>
            `).join('') || `<tr><td colspan="2" class="p-4 text-center text-slate-400 italic">Belum ada data uji Mineral</td></tr>`;

            return `
            <div class="max-w-4xl mx-auto w-full">
                <div class="mb-6 flex justify-between items-center">
                    <div>
                        <h2 class="font-heading text-2xl text-slate-800 font-bold">Buku Laporan Praktikum</h2>
                        <p class="text-slate-500 text-sm">Rekapitulasi otomatis data pengamatan.</p>
                    </div>
                    <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg font-bold shadow-md text-sm">
                        🖨️ Cetak PDF
                    </button>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                        <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 font-bold text-slate-700">Tabel 1. Hasil Uji Vitamin C</div>
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-100 text-slate-500 uppercase text-xs">
                                <tr><th class="p-3">Ekstrak Buah</th><th class="p-3 text-center">Tetes Betadine</th></tr>
                            </thead>
                            <tbody>${vitCHtml}</tbody>
                        </table>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                        <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 font-bold text-slate-700">Tabel 2. Hasil Uji Vitamin B6</div>
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-100 text-slate-500 uppercase text-xs">
                                <tr><th class="p-3">Sampel</th><th class="p-3">Warna / Kategori</th></tr>
                            </thead>
                            <tbody>${b6Html}</tbody>
                        </table>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden md:col-span-2">
                        <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 font-bold text-slate-700">Tabel 3. Hasil Uji Mineral (Kalsium, Fosfat, Klorida)</div>
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-100 text-slate-500 uppercase text-xs">
                                <tr><th class="p-3">Jenis Uji</th><th class="p-3">Hasil Pengamatan</th></tr>
                            </thead>
                            <tbody>${mineralHtml}</tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;
        }

        // Inisialisasi awal
        render();
    </script>
</body>
</html>
